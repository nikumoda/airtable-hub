<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Airtable Hub</title>
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --border: #e2e5ea;
    --text: #1a1d22;
    --muted: #5f6873;
    --accent: #2b59d6;
    --accent-soft: #e9eefc;
    --sidebar-w: 264px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101216;
      --surface: #171a1f;
      --border: #2a2e36;
      --text: #e6e9ed;
      --muted: #98a1ac;
      --accent: #84a6ff;
      --accent-soft: #1d2740;
    }
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: grid;
    grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
    height: 100dvh;
  }

  /* Sidebar */
  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .brand { padding: 20px 20px 14px; }
  .brand h1 { font-size: 17px; margin: 0; letter-spacing: -0.01em; }
  .brand p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  nav { overflow-y: auto; padding: 4px 10px 16px; }
  nav a {
    display: block;
    padding: 8px 12px;
    margin: 2px 0;
    border-radius: 8px;
    color: var(--text);
    text-decoration: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  nav a:hover { background: var(--bg); }
  nav a[aria-current="page"] {
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
  }
  nav a:focus-visible, .toolbar a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Main */
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .toolbar .titles { min-width: 0; flex: 1; }
  .toolbar h2 { font-size: 16px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .toolbar p { margin: 2px 0 0; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .toolbar p:empty { display: none; }
  .toolbar a {
    flex: none;
    font-size: 13px;
    color: var(--accent);
    text-decoration: none;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .toolbar a:hover { background: var(--accent-soft); }

  .stage { position: relative; flex: 1; min-height: 0; }
  .stage iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    background: transparent;
  }

  .loading {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    color: var(--muted);
    font-size: 14px;
    pointer-events: none;
  }

  .notice {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 24px;
  }
  .notice div {
    max-width: 440px;
    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: 12px;
    padding: 22px 24px;
    color: var(--muted);
  }
  .notice strong { color: var(--text); display: block; margin-bottom: 6px; }
  .notice code { font-size: 13px; }

  /* Phones and narrow windows: nav becomes a scrolling tab strip on top */
  @media (max-width: 820px) {
    body { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
    .sidebar { border-right: 0; border-bottom: 1px solid var(--border); }
    .brand { padding: 14px 16px 8px; }
    .brand p { display: none; }
    nav { display: flex; gap: 6px; overflow-x: auto; overflow-y: hidden; padding: 4px 16px 12px; scrollbar-width: none; }
    nav::-webkit-scrollbar { display: none; }
    nav a { flex: none; margin: 0; border: 1px solid var(--border); border-radius: 999px; padding: 6px 14px; }
    nav a[aria-current="page"] { border-color: transparent; }
    .toolbar { padding: 10px 16px; }
  }
</style>
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <h1 id="site-title"></h1>
      <p id="site-subtitle"></p>
    </div>
    <nav id="nav" aria-label="Interfaces"></nav>
  </aside>

  <main>
    <div class="toolbar">
      <div class="titles">
        <h2 id="page-title"></h2>
        <p id="page-desc"></p>
      </div>
      <a id="open-link" target="_blank" rel="noopener" hidden>Open in Airtable ↗</a>
    </div>
    <div class="stage" id="stage">
      <div class="loading" id="loading" hidden>Loading…</div>
    </div>
  </main>

<script>
  // ─────────────────────────────────────────────────────────────
  // EDIT HERE. One entry per interface page.
  // `url` accepts any of:
  //   • the public share link     https://airtable.com/appXXX/shrXXX
  //   • the embed link            https://airtable.com/embed/appXXX/shrXXX
  //   • the whole <iframe …> code Airtable gives you under "Embed"
  // ─────────────────────────────────────────────────────────────
  const SITE = {
    title: "Airtable Hub",
    subtitle: "Live views of our Airtable interfaces",
    interfaces: [
      { name: "Dashboard", description: "", url: "" },
      { name: "Requests", description: "", url: "" },
      { name: "Directory", description: "", url: "" },
    ],
  };

  // ─────────────────────────────────────────────────────────────

  function extractUrl(raw) {
    if (!raw) return null;
    const fromIframe = raw.match(/src\s*=\s*["']([^"']+)["']/i);
    try { return new URL((fromIframe ? fromIframe[1] : raw).trim()); }
    catch { return null; }
  }

  function toEmbed(raw) {
    const u = extractUrl(raw);
    if (!u) return null;
    if (u.hostname.endsWith("airtable.com") && !u.pathname.startsWith("/embed/")) {
      u.pathname = "/embed" + u.pathname;
    }
    return u.toString();
  }

  function toShare(raw) {
    const u = extractUrl(raw);
    if (!u) return null;
    u.pathname = u.pathname.replace(/^\/embed\//, "/");
    u.search = "";
    return u.toString();
  }

  function slugify(s) {
    return s.toLowerCase().normalize("NFKD").replace(/[^\w\s-]/g, "").trim().replace(/[\s_]+/g, "-");
  }

  const seen = new Set();
  const pages = SITE.interfaces.map((it, i) => {
    let slug = slugify(it.name || "") || `page-${i + 1}`;
    while (seen.has(slug)) slug += `-${i + 1}`;
    seen.add(slug);
    return { ...it, slug, src: toEmbed(it.url), share: toShare(it.url) };
  });

  const $ = (id) => document.getElementById(id);
  const stage = $("stage");
  const loading = $("loading");
  const openLink = $("open-link");
  const frames = new Map(); // slug -> element, kept alive so switching back is instant

  $("site-title").textContent = SITE.title;
  $("site-subtitle").textContent = SITE.subtitle || "";

  const nav = $("nav");
  for (const p of pages) {
    const a = document.createElement("a");
    a.href = `#${p.slug}`;
    a.textContent = p.name;
    a.dataset.slug = p.slug;
    nav.appendChild(a);
  }

  function frameFor(p) {
    if (frames.has(p.slug)) return frames.get(p.slug);
    let el;
    if (p.src) {
      el = document.createElement("iframe");
      el.title = p.name;
      el.src = p.src;
      el.allow = "clipboard-write; fullscreen";
      el.addEventListener("load", () => {
        el.dataset.loaded = "1";
        if (!el.hidden) loading.hidden = true;
      });
    } else {
      el = document.createElement("div");
      el.className = "notice";
      el.innerHTML = `<div><strong>No link yet for “${p.name.replace(/</g, "&lt;")}”</strong>
        In Airtable: <em>Share interface → Share to web</em>, turn it on for this page, open <em>Embed</em>,
        and paste the link into <code>SITE.interfaces</code> in <code>index.html</code>.</div>`;
      el.dataset.loaded = "1";
    }
    stage.appendChild(el);
    frames.set(p.slug, el);
    return el;
  }

  function show(slug) {
    const p = pages.find((x) => x.slug === slug) || pages[0];
    if (!p) {
      $("page-title").textContent = "No interfaces configured";
      return;
    }
    for (const a of nav.children) {
      const on = a.dataset.slug === p.slug;
      if (on) { a.setAttribute("aria-current", "page"); a.scrollIntoView({ block: "nearest", inline: "nearest" }); }
      else a.removeAttribute("aria-current");
    }
    const active = frameFor(p);
    for (const el of frames.values()) el.hidden = el !== active;
    loading.hidden = active.dataset.loaded === "1";

    $("page-title").textContent = p.name;
    $("page-desc").textContent = p.description || "";
    openLink.hidden = !p.share;
    if (p.share) openLink.href = p.share;
    document.title = `${p.name} · ${SITE.title}`;
  }

  window.addEventListener("hashchange", () => show(location.hash.slice(1)));
  show(location.hash.slice(1));
</script>
</body>
</html>
